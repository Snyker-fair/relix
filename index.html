<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Relix</title>
    <script>
      // Tema oscuro antes de pintar, sin destello celeste (lo mismo que src/lib/core/theme.js)
      try {
        var t = JSON.parse(localStorage.getItem('relix:settings') || '{}').theme
        var h = new Date().getHours()
        if (t === 'dark' || (t === 'auto' && (h >= 20 || h < 7))) document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
