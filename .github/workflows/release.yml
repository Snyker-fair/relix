# Cada etiqueta vX.Y.Z publica una versión: compila la interfaz y el shell,
# arma el paquete para la Xbox, lo firma con el certificado guardado como
# secreto y lo sube a GitHub Releases junto con sus dependencias.
#
# Secretos (Settings › Secrets and variables › Actions), una sola vez, con
# scripts/crear-certificado.ps1:
#   RELIX_CERT            el certificado (.pfx) en base64
#   RELIX_CERT_PASSWORD   su contraseña
#
# Publicar: npm version 1.0.1  ->  git push --follow-tags  (ver docs/COMPILAR.md)
#
# Cada cambio del shell en main (y Actions › Release › Run workflow) arma el
# mismo paquete como prueba, sin publicarlo: queda como artefacto del flujo.
# Sin los secretos, ese paquete de prueba sale sin firmar.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths: ['shell/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # windows-2022 trae Visual Studio 2022 con la carga de trabajo UWP, .NET Native
    # y el SDK 10.0.26100 que pide el proyecto
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Versión
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($tag -ne $version) { throw "La etiqueta es v$tag pero package.json dice $version" }
            "PUBLISH=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # El paquete UWP usa cuatro números: 1.0.0 -> 1.0.0.0
          $manifest = (Resolve-Path shell/RelixShell/Package.appxmanifest).Path
          [xml]$xml = Get-Content $manifest -Raw
          $xml.Package.Identity.Version = "$version.0"
          $xml.Save($manifest)

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Interfaz dentro del proyecto
        run: npm run build:shell

      - name: Certificado
        shell: pwsh
        env:
          RELIX_CERT: ${{ secrets.RELIX_CERT }}
          RELIX_CERT_PASSWORD: ${{ secrets.RELIX_CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP\release" | Out-Null
          if (-not $env:RELIX_CERT) {
            if ($env:PUBLISH) { throw 'Falta el secreto RELIX_CERT: ver docs/COMPILAR.md' }
            Write-Host '::warning::Sin el secreto RELIX_CERT: el paquete de prueba sale sin firmar'
            "SIGN=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "SIGN=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $pfx = "$env:RUNNER_TEMP\relix.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELIX_CERT))
          # La parte pública, para quien quiera instalarla (sin la clave privada)
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:RELIX_CERT_PASSWORD)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release\Relix.cer", $cert.Export('Cert'))
          Write-Host "Certificado: $($cert.Subject), válido hasta $($cert.NotAfter)"

      - uses: microsoft/setup-msbuild@v3

      - name: Paquete para la Xbox
        shell: pwsh
        env:
          RELIX_CERT_PASSWORD: ${{ secrets.RELIX_CERT_PASSWORD }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property catalog_productDisplayVersion
          $uwp = & $vswhere -latest -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          Write-Host "::notice::Visual Studio $vs · carga de trabajo UWP: $(if ($uwp) { 'sí' } else { 'no' })"

          $params = @(
            'shell\RelixShell\RelixShell.csproj', '-restore', '-verbosity:minimal', '-nologo',
            '-property:Configuration=Release', '-property:Platform=x64',
            '-property:GenerateAppxPackageOnBuild=true', '-property:UapAppxPackageBuildMode=SideloadOnly',
            '-property:AppxBundle=Never', "-property:AppxPackageDir=$env:RUNNER_TEMP\paquete\"
          )
          Write-Host "::notice::msbuild $($params -join ' ')"
          if ($env:SIGN -eq 'true') {
            $params += '-property:AppxPackageSigningEnabled=true'
            $params += "-property:PackageCertificateKeyFile=$env:RUNNER_TEMP\relix.pfx"
            $params += "-property:PackageCertificatePassword=$env:RELIX_CERT_PASSWORD"
          } else {
            $params += '-property:AppxPackageSigningEnabled=false'
          }
          & msbuild @params 2>&1 | Tee-Object -Variable log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Los errores como una anotación: se ven en el resumen de la ejecución
            $lines = @($log | ForEach-Object { "$_".Trim() } | Where-Object { $_ })
            $errors = @($lines | Select-String -Pattern 'error' -Context 0, 2 | Select-Object -First 8 |
              ForEach-Object { @($_.Line) + $_.Context.PostContext })
            if ($errors.Count -eq 0) { $errors = $lines | Select-Object -Last 15 }
            Write-Host "::error title=msbuild::$(($errors | Select-Object -Unique) -join '%0A')"
            exit $code
          }

      - name: Archivos y notas del release
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\release"
          $main = Get-ChildItem "$env:RUNNER_TEMP\paquete" -Recurse -File |
            Where-Object { $_.Extension -in '.msix', '.appx' -and $_.DirectoryName -notmatch 'Dependencies' } |
            Select-Object -First 1
          if (-not $main) { throw 'No se encontró el paquete' }
          Copy-Item $main.FullName "$out\Relix_$($env:VERSION)_x64$($main.Extension)"
          $deps = Join-Path $main.DirectoryName 'Dependencies\x64'
          Compress-Archive -Path "$deps\*" -DestinationPath "$out\Relix_$($env:VERSION)_Dependencies_x64.zip"
          Get-ChildItem $out | Format-Table Name, Length

          # Las notas: la sección de esta versión en CHANGELOG.md y cómo instalar
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() } else { '' }
          $install = @(
            '### Install',
            'Download `Relix_' + $env:VERSION + '_x64.msix` and `Relix_' + $env:VERSION + '_Dependencies_x64.zip`, extract the zip, then in the Device Portal: **My games & apps › Add**, pick the `.msix` and add the dependencies when it asks. Full steps in the [README](https://github.com/Snyker-fair/relix#install).',
            '',
            '**Instalar:** baja el `.msix` y el `.zip` de dependencias, descomprímelo y en el Device Portal: **My games & apps › Add**, elige el `.msix` y agrega las dependencias cuando las pida. Los pasos completos están en el [README en español](https://github.com/Snyker-fair/relix/blob/main/README.es.md#instalar).'
          ) -join "`n"
          "$notes`n`n$install" | Out-File "$env:RUNNER_TEMP\notas.md" -Encoding utf8

      - name: Paquete de prueba (sin publicar)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Relix_${{ env.VERSION }}_prueba
          path: ${{ runner.temp }}/release/
          retention-days: 14

      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Relix ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notas.md
          files: ${{ runner.temp }}/release/*
