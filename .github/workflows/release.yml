# Every vX.Y.Z tag prepares a version: it builds the interface and the shell,
# makes the Xbox package, signs it with the certificate kept as a secret and
# uploads it to GitHub Releases, with its dependencies, as a draft. It's
# published by hand after testing it on the Xbox.
#
# Secrets (Settings › Secrets and variables › Actions), only once, with
# scripts/create-certificate.ps1:
#   RELIX_CERT            the certificate (.pfx) in base64
#   RELIX_CERT_PASSWORD   its password
#
# Release: npm version 1.0.1  ->  git push --follow-tags  (see docs/BUILDING.md)
#
# Every shell change on main (and Actions › Release › Run workflow) builds the
# same package as a test, without releasing it: it stays as a workflow artifact.
# Without the secrets, that test package comes out unsigned.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    branches: [main]
    paths: ['shell/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # windows-2022 has Visual Studio 2022 with the UWP workload, .NET Native
    # and the 10.0.26100 SDK the project asks for
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($tag -ne $version) { throw "The tag is v$tag but package.json says $version" }
            "PUBLISH=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # The UWP package uses four numbers: 1.0.0 -> 1.0.0.0
          $manifest = (Resolve-Path shell/RelixShell/Package.appxmanifest).Path
          [xml]$xml = Get-Content $manifest -Raw
          $xml.Package.Identity.Version = "$version.0"
          $xml.Save($manifest)

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Interface inside the project
        run: npm run build:shell

      - name: Certificate
        shell: pwsh
        env:
          RELIX_CERT: ${{ secrets.RELIX_CERT }}
          RELIX_CERT_PASSWORD: ${{ secrets.RELIX_CERT_PASSWORD }}
        run: |
          New-Item -ItemType Directory "$env:RUNNER_TEMP\release" | Out-Null
          if (-not $env:RELIX_CERT) {
            if ($env:PUBLISH) { throw 'The RELIX_CERT secret is missing: see docs/BUILDING.md' }
            Write-Host '::warning::No RELIX_CERT secret: the test package comes out unsigned'
            "SIGN=false" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "SIGN=true" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $pfx = "$env:RUNNER_TEMP\relix.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELIX_CERT))
          # Opening it checks the password before building
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:RELIX_CERT_PASSWORD)
          Write-Host "Certificate: $($cert.Subject), valid until $($cert.NotAfter)"

      - uses: microsoft/setup-msbuild@v3

      - name: Xbox package
        shell: pwsh
        env:
          RELIX_CERT_PASSWORD: ${{ secrets.RELIX_CERT_PASSWORD }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property catalog_productDisplayVersion
          $uwp = & $vswhere -latest -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          Write-Host "::notice::Visual Studio $vs · UWP workload: $(if ($uwp) { 'yes' } else { 'no' })"

          $params = @(
            'shell\RelixShell\RelixShell.csproj', '-restore', '-verbosity:minimal', '-nologo',
            '-property:Configuration=Release', '-property:Platform=x64',
            '-property:GenerateAppxPackageOnBuild=true', '-property:UapAppxPackageBuildMode=SideloadOnly',
            '-property:AppxBundle=Never', "-property:AppxPackageDir=$env:RUNNER_TEMP\package\"
          )
          Write-Host "::notice::msbuild $($params -join ' ')"
          if ($env:SIGN -eq 'true') {
            $params += '-property:AppxPackageSigningEnabled=true'
            $params += "-property:PackageCertificateKeyFile=$env:RUNNER_TEMP\relix.pfx"
            $params += "-property:PackageCertificatePassword=$env:RELIX_CERT_PASSWORD"
          } else {
            $params += '-property:AppxPackageSigningEnabled=false'
          }
          & msbuild @params 2>&1 | Tee-Object -Variable log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # The errors as an annotation: they show in the run's summary
            $lines = @($log | ForEach-Object { "$_".Trim() } | Where-Object { $_ })
            $errors = @($lines | Select-String -Pattern 'error' -Context 0, 2 | Select-Object -First 8 |
              ForEach-Object { @($_.Line) + $_.Context.PostContext })
            if ($errors.Count -eq 0) { $errors = $lines | Select-Object -Last 15 }
            Write-Host "::error title=msbuild::$(($errors | Select-Object -Unique) -join '%0A')"
            exit $code
          }

      - name: Release files and notes
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\release"
          $main = Get-ChildItem "$env:RUNNER_TEMP\package" -Recurse -File |
            Where-Object { $_.Extension -in '.msix', '.appx' -and $_.DirectoryName -notmatch 'Dependencies' } |
            Select-Object -First 1
          if (-not $main) { throw 'The package was not found' }
          Copy-Item $main.FullName "$out\Relix_$($env:VERSION)_x64$($main.Extension)"
          $deps = Join-Path $main.DirectoryName 'Dependencies\x64'
          Compress-Archive -Path "$deps\*" -DestinationPath "$out\Relix_$($env:VERSION)_Dependencies_x64.zip"
          $files = Get-ChildItem $out | ForEach-Object { '{0} ({1:N1} MB)' -f $_.Name, ($_.Length / 1MB) }
          $depNames = Get-ChildItem $deps -File | ForEach-Object Name
          Write-Host "::notice title=Files::$($files -join ', ') · dependencies: $($depNames -join ', ')"

          # The notes: this version's section in CHANGELOG.md and how to install
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          $notes = if ($match.Success) { $match.Groups[1].Value.Trim() -replace '\r', '' } else { '' }
          # GitHub shows every line break: the lines of a paragraph are joined
          # (the ones that don't start a bullet, a heading, a table or a quote)
          $notes = $notes -replace '\n[ \t]*(?=\S)(?![-*+] |#|\||>|\d+\. )', ' '
          $install = @(
            '### Install',
            ('Download `Relix_{0}_x64.msix` and `Relix_{0}_Dependencies_x64.zip`, extract the zip, then in the Device Portal: **My games & apps › Add**, pick the `.msix` and add the dependencies when it asks. Full steps in the [README](https://github.com/Snyker-fair/relix#install).' -f $env:VERSION),
            '',
            '**Instalar:** baja el `.msix` y el `.zip` de dependencias, descomprímelo y en el Device Portal: **My games & apps › Add**, elige el `.msix` y agrega las dependencias cuando las pida. Los pasos completos están en el [README en español](https://github.com/Snyker-fair/relix/blob/main/README.es.md#instalar).'
          ) -join "`n"
          "$notes`n`n$install" | Out-File "$env:RUNNER_TEMP\notes.md" -Encoding utf8

      - name: Test package (not released)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Relix_${{ env.VERSION }}_test
          path: ${{ runner.temp }}/release/
          retention-days: 14

      - if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Relix ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ runner.temp }}/release/*
          # It stays a draft: it's tested on the Xbox and published by hand
          # (Releases › Edit › Publish release). Until then nobody sees it
          # and Xboxes don't announce the new version.
          draft: true
