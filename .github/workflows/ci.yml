# Tests and interface builds on every change: the types (svelte-check, from the
# JSDoc), the logic tests (vitest), that en.js has every text in English, and
# that both builds (the app's and the self-contained demo) come out without errors.
name: Tests

on:
  push:
    # next: the version in progress, before it's merged into main
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - run: npm test
      - name: Untranslated texts
        run: node scripts/i18n.mjs
      - run: npm run build
      - run: npm run build:single
