# Tests and interface builds on every change: the types (svelte-check, from the
# JSDoc), the logic tests (vitest), that en.js has every text in English (and
# nothing the code no longer has), and that both builds (the app's and the
# self-contained demo) come out without errors.
name: Tests

on:
  push:
    # next: the version in progress, before it's merged into main
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - run: npm test
      - name: Translations (missing or left over in en.js)
        run: node scripts/i18n.mjs
      - run: npm run build
      - run: npm run build:single

  ui:
    # The smoke tests (tests/e2e): the demo in Chromium, at the TV's size, driven
    # with the keyboard like a controller. A fixed Ubuntu: Playwright installs
    # Chromium's system libraries with the names of the versions it knows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # What it saw when something failed (a trace to open with npx playwright show-trace)
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
